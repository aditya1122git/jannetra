services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks: [database]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-jannetra}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the deployment environment}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in the deployment environment}
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:-}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_BACKUP_API_KEY: ${YOUTUBE_BACKUP_API_KEY:-}
      YOUTUBE_INITIAL_LOOKBACK_DAYS: ${YOUTUBE_INITIAL_LOOKBACK_DAYS:-7}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      HF_MODEL: ${HF_MODEL:-cardiffnlp/twitter-xlm-roberta-base-sentiment}
      HF_REVISION: ${HF_REVISION:-f2f1202b1bdeb07342385c3f807f9c07cd8f5cf8}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_CACHE_DIR: /home/app/.cache/huggingface
      HF_DEVICE: ${HF_DEVICE:-cpu}
      HF_BATCH_SIZE: ${HF_BATCH_SIZE:-16}
      HF_MAX_LENGTH: ${HF_MAX_LENGTH:-256}
      HF_CPU_THREADS: ${HF_CPU_THREADS:-2}
      HF_LOCAL_FILES_ONLY: ${HF_LOCAL_FILES_ONLY:-false}
      HF_CONFIDENCE_THRESHOLD: ${HF_CONFIDENCE_THRESHOLD:-0.80}
      GEMINI_CONCURRENCY: ${GEMINI_CONCURRENCY:-2}
      ENABLED_PLATFORMS: ${ENABLED_PLATFORMS:-facebook,instagram,x,youtube,news,reddit}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      REPORTING_TIMEZONE: ${REPORTING_TIMEZONE:-Asia/Kolkata}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      YOUTUBE_SYNC_INTERVAL_MINUTES: ${YOUTUBE_SYNC_INTERVAL_MINUTES:-15}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
    volumes:
      - hf_cache:/home/app/.cache/huggingface
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    networks: [database, web]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      start_period: 90s
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build: ./frontend
    # Bind on every VPS interface so http://SERVER_IP:8080 is reachable.
    # Hostinger's firewall must also allow TCP 8080 (or set PUBLIC_PORT=80).
    ports: ["${PUBLIC_PORT:-8080}:8080"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks: [web]
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://localhost:8080/]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
networks:
  database:
    internal: true
  web:
volumes:
  mongo_data:
  hf_cache:
